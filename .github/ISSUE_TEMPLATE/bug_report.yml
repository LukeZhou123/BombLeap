name: Bug 反馈
description: 报告游戏中的崩溃、卡关、画面或操作问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填完整，方便定位问题。
  - type: input
    id: version
    attributes:
      label: 游戏版本
      description: 标题页或安装包文件名上的版本号
      placeholder: 例如 1.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Windows
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？大致在哪个房间（例如 R12）？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入 R12
        2. 在门左侧放下炸弹并引爆
        3. 角色卡在墙里
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: 截图或录屏
      description: 直接把图片或视频拖进输入框即可
    validations:
      required: false
  - type: checkboxes
    id: extra
    attributes:
      label: 附加信息
      options:
        - label: 选择「重新开始」新开一局后问题依然存在（不是旧存档导致）
